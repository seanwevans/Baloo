name: Baloo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update        
        sudo apt-get install -y nasm bats strace

    - name: Install bats helpers
      run: |
        mkdir -p tests/test_helper        
        git clone --depth 1 https://github.com/bats-core/bats-support.git tests/test_helper/bats-support
        git clone --depth 1 https://github.com/bats-core/bats-assert.git tests/test_helper/bats-assert

    - name: Compile      
      run: make

    - name: Verify README catalog links
      run: make check-readme-links

    - name: Check formatting
      run: make lint-format

    - name: Run Tests
      timeout-minutes: 5
      run: make test TEST_FLAGS="--timing --print-output-on-failure"
